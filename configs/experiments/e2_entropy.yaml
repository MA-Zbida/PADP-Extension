name: e2_entropy
description: >
  Two-agent carry (k=2) over a long distance at entropy coefficients 0.01, 0.05 and 0.1. The 0.02
  level is the k2-long cell of e1_mechanism, which has the identical configuration.
base: ../base.yaml
seeds: [0, 1, 2, 3, 4]
overrides:
  env:
    layout: open
    n_racks: 0
    n_agents: 3
    n_objects: 1
    spawn: near_objects
    capacities: [50]
    weights: [90]
    carry_distance: [0.45, 0.55]
    max_steps: 100
  train:
    total_steps: 2000000
grid:
  - name: sampler
    key: train.sampler
    levels: {indep: independent, coupled: coupled}
  - name: entropy
    key: train.entropy_coef
    levels: {ent001: 0.01, ent005: 0.05, ent010: 0.1}
compare: {factor: sampler, baseline: indep, treatment: coupled}
