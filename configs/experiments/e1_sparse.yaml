name: e1_sparse
description: >
  As e1_mechanism with short carries, but the reward is only delivery and a step cost (no
  shaping).
base: e1_mechanism.yaml
seeds: [0, 1, 2, 3, 4]
overrides:
  env:
    reward_mode: sparse
    carry_distance: [0.2, 0.3]
grid:
  - name: sampler
    key: train.sampler
    levels: {indep: independent, coupled: coupled}
  - name: k
    key: env.weights
    levels: {k1: [40], k2: [90], k3: [140]}
compare: {factor: sampler, baseline: indep, treatment: coupled}
